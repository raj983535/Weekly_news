// [id, tier, category, title, what happened, why it matters, caveat, source]
var D=[
[20,"t1","B","Jensen Huang resigns as Nvidia CEO","Nvidia announced that Jensen Huang has resigned as president, CEO and board member. CFO Colette Kress steps in as interim CEO, Harvey C. Jones becomes board chair, and the board has started a search for a permanent successor.","Nvidia supplies much of the computing hardware the AI industry runs on, so a change at the top matters well beyond one company.","No reason for the resignation has been given. Don’t guess at one.","Nvidia announcement, SEC filing"],
[29,"t1","B","Anthropic launches its IPO roadshow","Anthropic has begun the roadshow for its proposed initial public offering. The preliminary prospectus sets out the formal terms, including a proposed price range and the number of shares.","It would move a leading AI lab from private funding to public markets, where financials and risks are examined far more closely.","The $1.4 trillion valuation figure is not established by the prospectus, so don’t repeat it as fact.","Anthropic announcement, preliminary prospectus"],
[28,"t1","M","Claude Fable 5.2 and Claude Mythos 5.2","Anthropic released two models. Fable is the broadly available one and ships with safeguards. Mythos is restricted to vetted organisations only.","It shows labs splitting their strongest capabilities into a public tier and a tightly controlled tier for sensitive use.","Pricing, speed and benchmark claims come from Anthropic’s own materials.","Anthropic announcement, Reuters"],
[24,"t1","M","Google introduces Gemini 4 Carbon","Google announced Gemini 4 Carbon, aimed at demanding long-horizon work such as complex multi-step coding and scientific research. Google has published its own performance and availability details.","It signals where the top end of frontier models is heading: longer, more autonomous tasks rather than single answers.","These are Google’s benchmarks. Test the model on your own workload before trusting comparisons.","Google"],
[40,"t1","B","OpenAI reportedly closes $11B of a new round","Reuters and Bloomberg report that OpenAI closed an initial $11 billion portion of a funding round at a reported valuation of $1.25 trillion, citing people familiar with the matter.","Funding at this scale shows how much capital is still flowing into building and running frontier AI.","Reported by the press, not officially confirmed by OpenAI in those articles.","Reuters, Bloomberg"],
[7,"t1","M","OpenAI Images 2.6 adds GIF creation","Images 2.6 arrives in ChatGPT, Codex and the API. It can generate GIFs from prompts or from existing images, lets you edit individual frames, and adds new API model options.","Image workflows can now stretch into short motion assets, and you can refine them step by step.","Speed and usage numbers are reported by OpenAI itself.","OpenAI"],
[1,"t1","S","Botpress breach exposes customer credentials","An attacker used an employee credential to exploit a flaw in an internal authentication proxy. They reached bot configurations in 16 customer workspaces and changed an integration setting in two of them.","Those configurations can hold AI-provider keys, messaging tokens and CRM credentials, which is exactly what agent platforms store to connect AI to business tools.","Botpress says it found no evidence that end-user conversations or source code were accessed.","Botpress incident disclosure"],
[15,"t1","S","Fireworks AI security incident","An incident at a third-party cloud provider let an attacker access Fireworks development machines. For a limited set of accounts, account and billing information, secrets, datasets and incomplete model weights were affected.","It is a clear example of supply-chain risk: an AI infrastructure company was exposed through its own provider.","Fireworks says its inference, training SDK and Nexus services were not affected.","Fireworks security bulletin, TechCrunch"],
[25,"t2","M","Google launches Gemini 4 Hydrogen","Hydrogen is a separate model in the Gemini 4 family, positioned for faster everyday coding and agentic workflows.","Google now offers a heavy-reasoning model and a faster everyday model, so people have to match the model to the job.","Not the same as Gemini 4 Carbon. They target different workloads.","Google DeepMind model card, Google Cloud release notes"],
[23,"t2","M","Gemini Decisions API","Google introduced Gemini Decision 1 and the Gemini Decisions API. One input, such as a document or video, can be checked against up to 1,000 yes/no, multiple-choice or rubric-scoring questions in a single request, with confidence scores.","For classification and routing, a structured answer can be cheaper and easier to use than a long generated reply.","","Google"],
[11,"t2","M","Meta introduces Muse Ember","Muse Ember is a smaller, cheaper model built for repeated agent steps such as tool calls, routing, document extraction and coding subtasks. It has a one-million-token context window and costs $0.10 per million input tokens and $0.50 per million output tokens.","It supports a practical agent pattern: send routine steps to cheap models and save the expensive ones for hard reasoning.","","Meta"],
[17,"t2","A","Businesses in ChatGPT and Business Hub","Organisations can claim and verify business profiles in ChatGPT, add product information and feeds, and see aggregated metrics such as mentions and website clicks. Eligible US ecommerce and online-service businesses can also build Business Agents to answer customer questions.","AI assistants are becoming a new channel for product discovery and customer support.","OpenAI says businesses do not receive users’ private conversations.","OpenAI"],
[16,"t2","P","Reports on Nvidia’s guidance on China exposure","The Financial Times and The Information reported that Nvidia asked some cloud partners to limit exposure to Chinese customers, including a reported threshold of 51% non-China customers.","It shows how export controls and geopolitics shape who can get access to AI compute.","Nvidia did not confirm this, and the guidance was described as non-mandatory. Don’t present it as formal policy.","The Information, Yahoo Finance"],
[9,"t2","A","DeepSeek’s Harness reports fast adoption","DeepSeek says its open-source agent app Harness reached 1.54 million daily users and 5.48 million monthly users, with a growing ecosystem of third-party plugins.","Agent platforms depend on plugins, and every plugin adds permission and security risks.","These figures are reported by the company and not independently audited.","Bloomberg"],
[22,"t2","A","United restricts third-party AI booking agents","United said it is taking steps to stop unauthorised personal AI agents from making reservations through its digital platforms and intermediaries, citing account credentials, unintended purchases and regulatory duties.","Agentic commerce will depend on the rules businesses set, not only on what agents can technically do.","","CBS News"],
[31,"t2","B","ChatGPT Enterprise comes to AWS Marketplace","Organisations can now buy and manage ChatGPT Enterprise through AWS Marketplace, using their existing AWS procurement and billing relationships.","Easier buying removes a common barrier to enterprise adoption.","This is a distribution change, not a new model release.","OpenAI"],
[18,"t2","A","Adobe previews MCP integrations for Creative Cloud","Adobe announced preview integrations using the Model Context Protocol for Photoshop, Illustrator, Premiere and After Effects, so third-party agents can work with native project files while keeping layers, sequences and compositions editable.","AI agents are starting to work inside professional software instead of just producing standalone outputs.","","Adobe"],
[26,"t2","M","Google DeepMind introduces Gemini Robotics 2.5","Gemini Robotics 2.5 is a vision-language-action model designed to help robots understand their surroundings and carry out physical tasks, with a focus on handling a wider range of real-world activities.","AI development is moving from screens and software into physical systems.","","Google DeepMind"],
[27,"t2","I","Google adds TPU 8tx and TPU 8i Max","Two new chips join Google’s eighth-generation TPU line. TPU 8tx supports confidential inference, and TPU 8i Max is built for large context windows with more compute and memory.","Specialised chips, memory bandwidth and secure processing are now central to running AI at scale.","","Google"],
[38,"t2","B","Gartner forecasts about $4.05 trillion in AI spending for 2027","Gartner expects worldwide AI spending of roughly $4.05 trillion in 2027, with about 59% going to AI infrastructure. It also forecasts growth in AI software and services.","It gives a sense of the scale of investment expected in compute, data centres, software and implementation.","This is an analyst forecast, not actual spending.","Gartner"],
[2,"t3","P","India’s DSCI publishes guidance on AI agent liability","The Data Security Council of India released an industry guide on how responsibility could be shared among deployers, integrators, product companies, tool providers and cloud providers when autonomous agents cause harm. It suggests limited permissions, human approval for important actions, monitoring and emergency shutdowns.","It gives organisations a practical starting point for deciding who is accountable when an agent goes wrong.","Industry guidance, not a new binding law.","DSCI guide and announcement"],
[3,"t3","I","Google plans a $17B data-centre investment in Wyoming","The plan includes a 702 MW fuel-cell development with carbon capture and storage as part of its energy supply.","It shows that AI growth depends on electricity, grid capacity, cooling and local planning.","","Google"],
[4,"t3","B","Bank of England survey finds modest AI productivity gains","In its November Monetary Policy Report, the Bank said firms in its Decision Maker Panel estimate AI has raised productivity by around 0.5% over the past three years, and they expect more gains over the next three.","It is a measured, real-world data point in a debate full of hype.","These are survey-based estimates, not an experimentally proven effect.","Bank of England"],
[5,"t3","P","CERT-In publishes AI security auditing guidelines","India’s CERT-In described a risk-based way to assess AI systems, including audit scope, evidence requirements and extra testing for generative AI, large language models and agentic systems.","Organisations in India get a reference for how AI systems may be audited for security.","Read the original for scope and applicability. It is not a comprehensive AI law.","CERT-In guideline PDF"],
[6,"t3","B","Companies focus on controlling AI inference costs","Bloomberg reported that Apple cut some engineers’ daily AI spending limits. The Register reported that Revolut reduced AI coding inference costs by roughly 90% after making self-hosted open-weight GLM models its default.","Usage limits, model choice and GPU running costs are becoming central to enterprise AI plans.","The Revolut number is a company-reported comparison, not an independent benchmark.","Bloomberg, The Register"],
[8,"t3","R","Experiment shows secret-leakage risk in groups of AI agents","AE Studio put coding agents in a sandboxed task with a simulated forum. In the swarm setup, agents posted a fake private token in 15% of trials, versus 2% in an ordinary forum. One agent also ran an untrusted installation script.","It points to a possible failure mode when many agents share a space.","The credentials were fake and the setting was a sandbox, so this was not a real data breach.","AE Studio"],
[10,"t3","I","Microchip reports longer semiconductor lead times","On its earnings call, Microchip said lead times on many products have stretched to roughly 6 to 32 weeks, citing inventory and manufacturing capacity limits.","AI infrastructure relies on a wide chip supply chain, including networking and power-management parts.","AI data-centre demand was one factor, but the company did not blame all pressure on AI.","Earnings-call transcript"],
[12,"t3","X","PhysicsWallah uses AI across education operations","Management described using AI for content creation, quality checks, test-paper preparation and evaluation, and said AI writes a large share of the company’s code.","It shows an Indian education company building AI into daily operations.","These are management statements and don’t prove AI alone caused workforce changes.","Entrackr, company filing"],
[13,"t3","R","Co-Design Bench tests whether coding agents finish real tasks","The benchmark covers 273 tasks taken from real coding sessions. The best of ten model endpoints fully satisfied 26.4% of them.","It shows why agents should be judged on complete task outcomes, not partial correctness.","Not the success rate of every coding agent.","Research paper"],
[14,"t3","A","Skyfall AI tests agents running small online businesses","Skyfall introduced Steve-001, a network of agents used to operate three acquired digital businesses. Results were mixed, and a human owner stayed responsible for direction and major approvals.","It judges agents on business outcomes such as revenue and customer impact rather than isolated benchmarks.","Results were shared by the company and are not audited.","The Next Web"],
[19,"t3","P","Google’s proposed Spirit Airlines data purchase","Reuters reported that Google agreed to stronger privacy safeguards in a proposed $10 million purchase of data from bankrupt Spirit Airlines for AI training. Safeguards include de-identification, exclusion of sensitive employee data, independent review and limits on re-identification.","It raises privacy questions about what data ends up in AI training when companies fail.","Still proposed. It needed bankruptcy-court approval at the time of reporting.","Reuters"],
[21,"t3","I","OpenAI offers GPT-6 Luna inference in India","Supported GPT-6 Luna API requests can be processed in India, Japan and Australia. It requires approved Zero Data Retention and a regional API project.","Regional processing helps organisations that must keep data in a specific location.","Does not mean every ChatGPT conversation is processed in India.","OpenAI API release notes"],
[30,"t3","P","Anthropic updates its Usage Policy","The updated policy took effect in November. It consolidates rules against deceptive campaigns and artificial activity, such as fake accounts and fabricated news sites, alongside other prohibited uses.","It matters to businesses using AI in marketing, communications and other sensitive areas.","","Anthropic policy update, legal centre"],
[32,"t3","B","OpenAI offers ChatGPT Plus to veterans","Eligible transitioning US servicemembers and veterans get a year of ChatGPT Plus at no cost, along with AI-skills training programmes.","It targets a specific community with access and training.","US only, and not a general free subscription.","OpenAI"],
[33,"t3","S","OpenAI presents GPT-6 Cyber","OpenAI introduced GPT-6 Cyber for authorised cybersecurity work and held a Cyber at the Frontier event on AI in security research.","The challenge is helping defenders find and validate vulnerabilities while keeping use within authorised work.","The model announcement came before this seven-day window. The event fell inside it.","OpenAI announcement, Cyber at the Frontier"],
[34,"t3","A","Esri connects AI agents to ArcGIS","Agents such as Claude and Microsoft Copilot Studio can connect to ArcGIS through MCP to use geographic context, search spatial data, plan routes and run spatial queries.","Agents can work with specialised enterprise data, not only general questions.","Some integrations are in beta.","Esri"],
[35,"t3","X","Oracle launches AI financial-services analytics","Treasury Analytics and Customer Analytics combine curated financial data with AI-assisted exploration. Users can ask questions in plain language, create visuals and spot patterns.","AI is being built into specialised banking and finance workflows.","","Oracle"],
[36,"t3","X","DuPont, Microsoft and NobleAI collaborate on R&D","DuPont will apply machine learning and Microsoft Discovery to research and development, aiming to guide experiments, evaluate solutions and shorten development cycles.","It is an applied-science example of AI supporting materials research and product development.","","DuPont"],
[37,"t3","P","UNESCO publishes an AI literacy guide","The guide, AI Answers. You Decide, helps educators and learners judge AI-generated information, recognise bias and think critically about AI’s influence on knowledge.","AI literacy is about evaluating evidence and limits, not only writing prompts.","","UNESCO"],
[39,"t3","X","NTT DATA partners with the Nitto ATP Finals","The AI consulting partnership brings AI, computer vision and data-driven experiences for player performance and fan engagement.","A practical example of AI in sports analytics and live events.","","NTT DATA"]
];
