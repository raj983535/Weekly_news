        let selectedCategory = 'ALL';

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#15803d] text-white transition whitespace-nowrap";
                } else {
                    btn.className = "cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#e6f7ed] text-[#166534] hover:bg-[#dcfce7] transition whitespace-nowrap";
                }
            });
            renderNews();
        }

        function renderNews() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = newsItems.filter(item => {
                const matchCat = selectedCategory === 'ALL' || item.category === selectedCategory;
                const matchSearch = !query ||
                    item.title.toLowerCase().includes(query) ||
                    item.summary.toLowerCase().includes(query) ||
                    item.links.some(link => link.toLowerCase().includes(query));
                return matchCat && matchSearch;
            });

            if (sortBy === 'pdf') {
                filtered.sort((a, b) => a.pdfId - b.pdfId);
            } else {
                filtered.sort((a, b) => a.importantRank - b.importantRank);
            }

            document.getElementById('itemCount').textContent = `${filtered.length} ${filtered.length === 1 ? 'item' : 'items'}`;

            const grid = document.getElementById('newsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white border border-[#cce8d6] rounded-xl p-8 text-center text-[#166534] text-sm">
                        No matching news items found.
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const displayNumber = sortBy === 'pdf' ? item.pdfId : item.importantRank;
                const linksHtml = item.links.map(url => `
                    <a href="${url}" target="_blank" rel="noopener noreferrer" class="block text-[#15803d] hover:text-[#14532d] hover:underline break-all leading-snug">
                        ${url}
                    </a>
                `).join('');

                return `
                    <article class="bg-white border border-[#cce8d6] rounded-xl p-5 flex flex-col justify-between shadow-sm hover:border-[#86efac] transition">
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-2.5">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold bg-[#dcfce7] text-[#166534]">
                                    #${displayNumber}
                                </span>
                                <span class="text-xs font-medium text-[#15803d]">
                                    ${item.category}
                                </span>
                            </div>
                            <h2 class="text-base font-bold text-slate-900 leading-snug mb-2">
                                ${item.title}
                            </h2>
                            <p class="text-sm text-slate-700 leading-relaxed">
                                ${item.summary}
                            </p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-[#e6f7ed] text-xs space-y-1">
                            <span class="font-semibold text-[#166534] block">Verification links:</span>
                            ${linksHtml}
                        </div>
                    </article>
                `;
            }).join('');
        }

        window.onload = renderNews;
    </script>
